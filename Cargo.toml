[workspace]
members = ["crates/core", "crates/torrent", "crates/cli", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.0.0"

[workspace.dependencies]
marquee-core = { path = "crates/core" }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "2"
uuid = { version = "1", features = ["v4", "serde"] }
flate2 = "1"
tar = "0.4"
zip = { version = "2", default-features = false, features = ["deflate"] }
tiny_http = "0.12"

<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marquee · Saved catalogue POC</title>
<style>
  :root { color-scheme:dark; font:15px system-ui,sans-serif; background:#101319; color:#ecf0f7; }
  * { box-sizing:border-box; } body { margin:0; } header { padding:28px 32px; border-bottom:1px solid #303847; }
  h1 { margin:0 0 10px; font-size:28px; } h2 { font-size:22px; } p { line-height:1.6; color:#afbccc; }
  .eyebrow { color:#9bd8b8; text-transform:uppercase; letter-spacing:.13em; font-size:12px; }
  .layout { display:grid; grid-template-columns:230px minmax(300px,1fr) minmax(300px,420px); min-height:75vh; }
  aside, main, section { padding:24px; min-width:0; } aside { border-right:1px solid #303847; }
  section { border-left:1px solid #303847; } button, input, select, a.action { font:inherit; color:inherit; background:#1c2430; border:1px solid #3b4759; border-radius:9px; padding:10px 12px; }
  button { cursor:pointer; text-align:left; } button:hover, a.action:hover { background:#29374a; }
  :focus-visible { outline:3px solid #9bd8b8; outline-offset:3px; } input { width:100%; }
  label { display:grid; gap:7px; min-width:0; color:#afbccc; font-size:13px; } select { min-width:0; max-width:100%; } .filters { display:flex; gap:12px; flex-wrap:wrap; margin:16px 0; }
  .systems, .games { display:grid; gap:8px; } .systems { max-height:65vh; overflow:auto; }
  .system { width:100%; } .active, button[aria-pressed=true] { border-color:#9bd8b8; background:#253b34; }
  .game { width:100%; display:grid; gap:5px; } small { color:#a9b7c9; font-size:12px; }
  .badge { display:inline-block; border:1px solid #4b635a; border-radius:6px; padding:4px 7px; font-size:12px; color:#a9ddc1; }
  .action { display:inline-block; text-decoration:none; margin:14px 0; background:#284637!important; }
  dl { display:grid; grid-template-columns:85px 1fr; gap:12px; font-size:13px; } dt { color:#a9b7c9; } dd { margin:0; overflow-wrap:anywhere; }
  .empty { padding:20px 0; } [hidden] { display:none!important; } .variant { margin:20px 0; }
  @media(max-width:1050px) { .layout { grid-template-columns:180px 1fr; } section { grid-column:1/-1; border-top:1px solid #303847; border-left:0; } }
  @media(max-width:600px) { .layout { display:block; } aside { border:0; } .systems { max-height:170px; } header { padding:24px; } }
</style>
<header><div class="eyebrow">Marquee / browser connector experiment</div><h1>Explore the saved Vault catalogue</h1><p id="summary"></p><span class="badge">Offline snapshots · Live availability unknown</span></header>
<div class="layout">
  <aside><h2>Systems</h2><div id="systems" class="systems"></div></aside>
  <main><h2 id="heading"></h2><label>Search games<input id="search" type="search" placeholder="Title, region or language…"></label><div class="filters"><label>Region<select id="region"><option value="">All regions</option></select></label><label>Language<select id="language"><option value="">All languages</option></select></label></div><p id="count" role="status" aria-live="polite"></p><div id="games" class="games"></div></main>
  <section aria-label="Game details"><div id="details"></div></section>
</div>
<script id="snapshot" type="application/json">__SNAPSHOT_JSON__</script>
<script>
  const data = JSON.parse(document.getElementById('snapshot').textContent);
  const $ = id => document.getElementById(id);
  let system = data.system;
  let selected = location.hash.slice(1) || data.detail_game_id;
  const el = (tag, text, className) => { const node=document.createElement(tag); if(text!==undefined) node.textContent=text; if(className) node.className=className; return node; };
  const liveLink = (url, label) => { const a=el('a',label,'action'); a.href=url; a.target='_blank'; a.rel='noopener noreferrer'; return a; };
  $('summary').textContent=`${data.systems.length} systems · ${data.games.length} games from ${data.system}, section ${data.section} · 1 saved detail page`;
  const tokens = (value, field) => value.split(field==='languages'?/[\s,|]+/:/\s*[,|]\s*/).filter(v=>v && v!=='-');
  for(const [id, field] of [['region','regions'],['language','languages']]) {
    const values=[...new Set(data.games.flatMap(g=>tokens(g[field],field)).filter(Boolean))].sort();
    for(const value of values) { const option=el('option',value); option.value=value; $(id).append(option); }
  }
  function showDetails() {
    const box=$('details'); box.replaceChildren();
    const game=data.games.find(g=>g.game_id===selected && g.system===system);
    if(!game) { box.append(el('h2','Choose a game'),el('p','Select a catalogue entry to inspect its snapshot and open the live page.')); return; }
    box.append(el('span',game.system,'eyebrow'),el('h2',game.title),el('p',`${game.regions} · ${game.languages} · Version ${game.version}`));
    box.append(liveLink(game.url,'Open live page in a new tab ↗'));
    box.append(el('p','The live tab uses this browser session. Any download is handled on the current website, not by the saved snapshot.'));
    if(!game.has_detail) { box.append(el('p','No detail HTML saved for this game. Media variants are unknown.','empty')); return; }
    box.append(el('span','Saved media metadata','badge'));
    if(game.cover) { const image=el('img'); image.src=game.cover.data_url; image.alt=`${game.title} box cover`; image.style.cssText='display:block;width:150px;height:auto;margin:16px 0;border-radius:8px'; box.append(image,el('p',game.cover.credit)); }
    box.append(el('p',`${game.players??'Unknown'} player(s) · Release year ${game.year??'unknown'} · Source overall ${game.ratings?.overall??'unknown'}/10 (${game.rating_votes??'unknown'} votes) · Source verified ${game.verified_at??'unknown'}`));
    const label=el('label','Media variant'); label.className='variant'; const select=el('select'); select.id='variant';
    for(const media of game.media) { const option=el('option',`${media.filename} · v${media.version} · ${media.size}`); option.value=media.media_id; select.append(option); }
    label.append(select); box.append(label); const fields=el('dl'); box.append(fields);
    function renderMedia() { fields.replaceChildren(); const media=game.media.find(m=>m.media_id===select.value); if(!media) return; for(const [name,value] of [['Media ID',media.media_id],['Filename',media.filename],['Version',media.version],['Size',media.size],['Serial',media.serial||'Not supplied'],['CRC32',media.crc32],['MD5',media.md5],['SHA-1',media.sha1]]) fields.append(el('dt',name),el('dd',value||'Not supplied')); }
    select.onchange=renderMedia; renderMedia();
  }
  function render() {
    const systems=$('systems'); systems.replaceChildren();
    for(const entry of data.systems) { const button=el('button',`${entry.name} (${entry.sample_games})`,'system'); button.setAttribute('aria-pressed',String(system===entry.slug)); button.onclick=()=>{ system=entry.slug; selected=''; $('search').value=''; $('region').value=''; $('language').value=''; history.replaceState(null,'',location.pathname); render(); }; systems.append(button); }
    const current=data.systems.find(s=>s.slug===system); $('heading').textContent=current?.name||system;
    const query=$('search').value.trim().toLowerCase();
    const games=data.games.filter(g=>g.system===system && `${g.title} ${g.regions} ${g.languages}`.toLowerCase().includes(query) && (!$('region').value||tokens(g.regions,'regions').includes($('region').value)) && (!$('language').value||tokens(g.languages,'languages').includes($('language').value)));
    $('count').textContent=`${games.length} matching games in the saved catalogue`;
    const list=$('games'); list.replaceChildren();
    for(const game of games) { const button=el('button',undefined,'game'); button.setAttribute('aria-pressed',String(game.game_id===selected)); button.append(el('strong',game.title),el('small',`${game.regions} · ${game.languages} · ${game.has_detail?'Detail snapshot available':'Catalogue only'}`)); button.onclick=()=>{ selected=game.game_id; history.replaceState(null,'',`#${selected}`); render(); }; list.append(button); }
    if(!games.length) { list.append(el('p',current?.sample_games?'No games match these filters.':'No catalogue pages were saved for this system.','empty')); if(current && !current.sample_games) list.append(liveLink(current.url,'Open live system page ↗')); }
    showDetails();
  }
  for(const id of ['search','region','language']) $(id).addEventListener(id==='search'?'input':'change',render);
  window.addEventListener('hashchange',()=>{ selected=location.hash.slice(1); render(); });
  render();
</script>
</html>

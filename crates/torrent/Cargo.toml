[package]
name = "marquee-torrent"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Optional BitTorrent transport for Marquee's own library (embedded librqbit)"

[dependencies]
librqbit = { version = "9", default-features = false, features = ["default-tls", "disable-upload"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
anyhow = "1"

[dev-dependencies]
tempfile = "3"

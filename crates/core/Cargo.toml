[package]
name = "marquee-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Library, scan, runner and session core for Marquee"

[dependencies]
marquee-media.workspace = true
marquee-manager.workspace = true
libc = "0.2"
flate2.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tiny_http.workspace = true
ureq.workspace = true
uuid.workspace = true
zip.workspace = true
marquee-torrent = { path = "../torrent" }
anyhow = "1"
tempfile = "3"
base64 = "0.22"
sha1 = "0.10"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }

[target.'cfg(unix)'.dependencies]
socket2 = "0.6"

[dev-dependencies]
marquee-media = { workspace = true, features = ["test-fixtures"] }
